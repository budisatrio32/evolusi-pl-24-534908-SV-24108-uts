# ===========================================================================
# Aplikasi Peminjaman Buku: MySQL + backend Laravel (FrankenPHP) + frontend Vue (Nginx)
#
#   Browser ──:8080──► frontend ──/api──► backend:8000 ──► db:3306
#
# Konfigurasi dibaca dari berkas .env di folder ini (salin dari .env.example).
# Ketiga service berada di satu network dan saling menemukan lewat NAMA SERVICE:
# backend memanggil host "db", Nginx di frontend meneruskan /api ke "backend".
# ===========================================================================
name: kepl-uts

services:
  # -------------------------------------------------------------------------
  # Basis data MySQL. Port 3306 sengaja tidak dibuka ke laptop: hanya service
  # lain di network kepl-uts-net yang boleh terhubung.
  # -------------------------------------------------------------------------
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE wajib diisi di .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi di .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      # Named volume: data tetap ada walaupun container dihapus dan dibuat ulang.
      - db-data:/var/lib/mysql
    networks:
      - kepl-net
    healthcheck:
      # Lewat TCP (127.0.0.1), jadi baru sehat setelah server MySQL yang sebenarnya
      # berjalan, bukan server sementara saat inisialisasi pertama.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # -------------------------------------------------------------------------
  # Backend Laravel 12 di FrankenPHP. Dibangun dari Dockerfile di root.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
    image: ${BACKEND_IMAGE:-kepl-uts-backend}:${IMAGE_TAG:-1.0}
    restart: unless-stopped
    environment:
      APP_NAME: "Peminjaman Buku"
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env (php artisan key:generate)}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db                       # nama service MySQL di atas
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy      # tunggu MySQL siap, bukan sekadar start
    ports:
      - "${BACKEND_PORT:-8000}:8000"    # dibuka untuk pengujian lewat Postman
    networks:
      - kepl-net

  # -------------------------------------------------------------------------
  # Frontend Vue 3 hasil build, dilayani Nginx. Dibangun dari frontend/Dockerfile.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api              # nilai publik, ikut tertanam di berkas JS
    image: ${FRONTEND_IMAGE:-kepl-uts-frontend}:${IMAGE_TAG:-1.0}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000 # nama service backend di atas
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - kepl-net

networks:
  kepl-net:
    name: kepl-uts-net

volumes:
  db-data:
    name: kepl-uts-db-data
