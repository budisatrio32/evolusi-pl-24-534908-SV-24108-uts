; Konfigurasi PHP tambahan untuk container produksi.

; Jangan umumkan versi PHP lewat header X-Powered-By.
expose_php = Off

; Kode di dalam image tidak pernah berubah selama container hidup, jadi OPcache
; tidak perlu memeriksa ulang timestamp berkas setiap request.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
